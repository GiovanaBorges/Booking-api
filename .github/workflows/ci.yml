name: Java CI com Testcontainers RabbitMQ

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar .env (sanitizado)
        shell: bash
        run: |
          echo "Conteúdo do .env no CI:"
          sed -E \
            -e 's/(RABBITMQ_PASSWORD=).*/\1****/' \
            -e 's/(RABBITMQ_USERNAME=).*/\1****/' \
          .env
          
       # --------------- SETUP JAVA + MAVEN ---------------
      - name: Setup Java + Maven
        uses: ./.github/actions/setup-java-maven
        with:
          java-version: 17

      - name: Rodar testes (incluindo Testcontainers)
        shell: bash
        run: mvn -B clean verify

      # --------------- UPLOAD RELATÓRIO JACOCO ---------------
      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/  

       # --------------- UPLOAD RELATÓRIOS DE TESTE ---------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
